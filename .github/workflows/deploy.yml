name: Deploy Peakr

# Manual-only (workflow_dispatch) so nothing touches shared infrastructure
# unexpectedly. Run it from the repo's Actions tab → "Deploy Peakr" → Run
# workflow, after completing the one-time setup below.
#
# One-time setup:
#   1. Settings → Pages → Source: "GitHub Actions" (enables the frontend job).
#   2. Add repo Secrets (Settings → Secrets and variables → Actions):
#        SUPABASE_ACCESS_TOKEN     (supabase access token)
#        SUPABASE_PROJECT_REF      (your project ref)
#        SUPABASE_DB_PASSWORD      (database password, for `db push`)
#        VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY, VAPID_SUBJECT   (push)
#        TICKETMASTER_API_KEY      (events; optional)
#        RESEND_API_KEY            (email codes; optional)
#        ADMIN_KEY                 (analytics dashboard)
#        REFERRAL_POSTBACK_SECRET  (affiliate callback)
#        PEAKR_API_BASE            (e.g. https://<ref>.functions.supabase.co/api)
#   The backend job self-skips if the Supabase secrets are absent; the frontend
#   job deploys standalone if PEAKR_API_BASE is absent.
#
# Note: workflow_dispatch only appears once this file is on the default branch.

on:
  workflow_dispatch:
    inputs:
      target:
        description: What to deploy
        type: choice
        options: [both, backend, frontend]
        default: both

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  backend:
    if: ${{ github.event.inputs.target == 'backend' || github.event.inputs.target == 'both' }}
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Check Supabase secrets
        id: guard
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then
            echo "::warning::Supabase secrets not set — skipping backend deploy."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.ok == 'true'

      - uses: supabase/setup-cli@v1
        if: steps.guard.outputs.ok == 'true'
        with:
          version: latest

      - name: Link project
        if: steps.guard.outputs.ok == 'true'
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Push migrations
        if: steps.guard.outputs.ok == 'true'
        working-directory: gig-optimizer/backend
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"

      - name: Deploy Edge Functions
        if: steps.guard.outputs.ok == 'true'
        working-directory: gig-optimizer/backend
        run: |
          supabase functions deploy api          --project-ref "$PROJECT_REF"
          supabase functions deploy aggregate     --project-ref "$PROJECT_REF"
          supabase functions deploy scan-surges   --project-ref "$PROJECT_REF"

      - name: Set function secrets
        if: steps.guard.outputs.ok == 'true'
        env:
          K_ANONYMITY: ${{ secrets.K_ANONYMITY }}
          SURGE_FLOOR_CENTS: ${{ secrets.SURGE_FLOOR_CENTS }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          REFERRAL_POSTBACK_SECRET: ${{ secrets.REFERRAL_POSTBACK_SECRET }}
        run: |
          supabase secrets set --project-ref "$PROJECT_REF" \
            K_ANONYMITY="${K_ANONYMITY:-5}" \
            SURGE_FLOOR_CENTS="${SURGE_FLOOR_CENTS:-2500}" \
            VAPID_PUBLIC_KEY="$VAPID_PUBLIC_KEY" \
            VAPID_PRIVATE_KEY="$VAPID_PRIVATE_KEY" \
            VAPID_SUBJECT="${VAPID_SUBJECT:-mailto:ops@peakr.app}" \
            TICKETMASTER_API_KEY="$TICKETMASTER_API_KEY" \
            RESEND_API_KEY="$RESEND_API_KEY" \
            ADMIN_KEY="$ADMIN_KEY" \
            REFERRAL_POSTBACK_SECRET="$REFERRAL_POSTBACK_SECRET"

  frontend:
    if: ${{ github.event.inputs.target == 'frontend' || github.event.inputs.target == 'both' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Inject API base (turns the live backend on)
        env:
          PEAKR_API_BASE: ${{ secrets.PEAKR_API_BASE }}
        run: |
          if [ -n "$PEAKR_API_BASE" ]; then
            printf 'window.PEAKR_CONFIG = { apiBase: "%s" };\n' "$PEAKR_API_BASE" > gig-optimizer/config.js
            sed -i 's#<script src="backend-client.js"></script>#<script src="config.js"></script>\n  <script src="backend-client.js"></script>#' gig-optimizer/index.html
            echo "Injected API base — site will use the live backend."
          else
            echo "No PEAKR_API_BASE secret — deploying the standalone (seeded) demo."
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
